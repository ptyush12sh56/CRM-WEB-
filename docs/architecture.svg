<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mini CRM architecture</title>
<desc>React frontend calls a FastAPI backend, which reads and writes a PostgreSQL or SQLite database and calls the Anthropic API to generate follow-up email drafts.</desc>

<style>
  text{font-family:Inter,Arial,sans-serif;}
  .th{font-size:14px;font-weight:600;}
  .ts{font-size:12px;}
  .arr{stroke:#5B6270;stroke-width:1.2;fill:none;}
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5B6270" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="400" fill="#FFFFFF"/>

<line x1="340" y1="96" x2="340" y2="158" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="132" fill="#5B6270">HTTP / JSON</text>

<line x1="330" y1="216" x2="200" y2="278" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="150" y="248" fill="#5B6270">SQL</text>

<line x1="350" y1="216" x2="480" y2="278" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="440" y="248" fill="#5B6270">HTTPS</text>

<g>
  <rect x="240" y="40" width="200" height="56" rx="8" fill="#F1F2F4" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="340" y="63" text-anchor="middle" fill="#2C2C2A">React frontend</text>
  <text class="ts" x="340" y="81" text-anchor="middle" fill="#5F5E5A">Contacts &amp; pipeline UI</text>
</g>

<g>
  <rect x="240" y="160" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="340" y="183" text-anchor="middle" fill="#26215C">FastAPI backend</text>
  <text class="ts" x="340" y="201" text-anchor="middle" fill="#3C3489">REST API + JWT auth</text>
</g>

<g>
  <rect x="70" y="280" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text class="th" x="170" y="303" text-anchor="middle" fill="#04342C">PostgreSQL / SQLite</text>
  <text class="ts" x="170" y="321" text-anchor="middle" fill="#085041">Users &amp; contacts</text>
</g>

<g>
  <rect x="410" y="280" width="200" height="56" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text class="th" x="510" y="303" text-anchor="middle" fill="#4A1B0C">Anthropic API</text>
  <text class="ts" x="510" y="321" text-anchor="middle" fill="#712B13">Email draft generation</text>
</g>
</svg>
